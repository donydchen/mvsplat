# @package _global_

defaults:
  - override /dataset: custom
  - override /model/encoder: costvolume
  - override /loss: [mse, lpips]

wandb:
  name: custom
  tags: [custom, 256x256]

data_loader:
  train:
    batch_size: 5
    num_workers: 8  # Disable multiprocessing to avoid GPU conflicts
  val:
    num_workers: 1
  test:
    num_workers: 0

trainer:
  max_steps: 10_000
  limit_val_batches: 1  # Just run 1 validation batch to test

# ----- Additional params for default best model customization
model:
  encoder:
    num_depth_candidates: 128
    costvolume_unet_feat_dim: 128
    costvolume_unet_channel_mult: [1,1,1]
    costvolume_unet_attn_res: [4]
    gaussians_per_pixel: 1
    depth_unet_feat_dim: 32
    depth_unet_attn_res: [16]
    depth_unet_channel_mult: [1,1,1,1,1]
    visualizer:
      export_ply: true  # Export Gaussians to PLY files

# lpips loss
loss:
  lpips:
    apply_after_step: 0
    weight: 0.05

dataset: 
  dataset_path: "E:/dataset"  # Update this path
  data_df_path: "E:/dataset/_metadata/data_df.csv" # Update this path
  image_shape: [256, 256]
  near: 0.1
  far: 100.0

test:
  eval_time_skip_steps: 5
  compute_scores: true